<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho Prático</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nabla&display=swap" rel="stylesheet">
    
    <style>
    body, html {
        height: 100%;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column; 
        background-image: url("{{ url_for('static', filename='images/dinossauro2.png') }}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
    }

    .titulo {
        font-family: 'Nabla', system-ui, sans-serif;
        font-optical-sizing: auto;
        font-variation-settings: "EDPT" 100, "EHLT" 12;
        font-weight: 400; 
        font-style: normal; 
        font-size: 100px;
        text-transform: uppercase; 
        letter-spacing: 1.5px; 
        color: #0973c5; 
        margin-bottom: 30px; 
        text-align: center;
        line-height: 1.3; 
    }

    .container_busca{
        text-align: center;
        width: 100%;
        max-width: 580px; 
        padding: 20px;
        box-sizing: border-box; 
    }

    .search-hint {
        font-size: 15px;
        font-weight: 700;
        color: white; 
        margin-bottom: 12px;
        text-align: center;
        padding-left: 10px; 
    }

    .search-bar-wrapper {
        display: flex; 
        align-items: center;
        background-color: #f8f9fa; 
        border: 1px solid #f8f9fa; 
        border-radius: 24px; 
        padding: 0 16px; 
        margin-bottom: 25px; 
    }
    
    .search-bar-wrapper:hover,
    .search-bar-wrapper:focus-within { 
        border-color: rgba(223, 225, 229, 0);
        box-shadow: 0 1px 6px rgba(32, 33, 36, .28);
    }
    
    .search-icon {
        width: 20px;
        height: 20px;
        fill: #9aa0a6; 
        margin-right: 12px; 
    }

    .input_busca {
        width: 100%; 
        text-align: center;
        font-weight: 700;
        padding: 10px 0; 
        font-size: 20px;
        border: none;
        outline: none;
        background-color: transparent;
        color: #3c4043; 
    }

    .input_busca::placeholder {
        color: #5f6368; 
        opacity: 1; 
    }

    button {
        background-color: #f8f9fa; 
        font-style:normal;
        font-weight: 1000;
        border: 1px solid #f8f9fa;
        border-radius: 4px;
        color: #3c4043;
        font-size: 14px;
        padding: 10px 16px;
        cursor: pointer;
        margin: 0 5px; 
        size: auto  ;
    }

    button:hover {
        border: 1px solid #dadce0;
        box-shadow: 0 1px 1px rgba(0,0,0,.1);
        color: #202124;
        background-color: #ffae00;
        color: black;
    }
    </style>
</head>
    
<body>
    
    <div class="titulo">
        SUPER MEGA ULTRA <br> BUSCADOR
    </div>

    <div class="container_busca">

        <p class="search-hint">Use os operadores AND, OR e parêntesis () para refinar sua busca.</p>

        <form action="/buscar" method="post">
            
            <div class="search-bar-wrapper">
                
                <input type="text" name="query" class="input_busca" placeholder="Ex: (tennis AND sun) OR technology">
            </div>

            <button type="submit" class="botaobuscar">Buscar</button>
        </form>
    </div>
</body>

</html>
